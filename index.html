<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15123a">
  <title>Classroom Game · Join</title>
  <meta name="description" content="Join your class quiz: type the room code shown on the screen.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23ffd23f%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22>?</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="student">
    <div class="s-net" id="net" hidden></div>
    <header class="s-head" id="head" hidden>
      <span class="who" id="who"></span>
      <span class="pts" id="pts">0 pts</span>
    </header>

    <main class="s-main" id="main">
      <form class="join-form" id="joinForm" autocomplete="off">
        <div class="brand logo"><span class="brand-mark">?</span> Classroom Game</div>
        <label for="code" class="muted center">Room code (on the big screen)</label>
        <input id="code" class="code" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="5" placeholder="ABCDE" required>
        <label for="nick" class="muted center">Your nickname</label>
        <input id="nick" maxlength="20" autocomplete="nickname" spellcheck="false" placeholder="e.g. Juan D." required enterkeyhint="go">
        <div class="form-error" id="formError" hidden></div>
        <button class="btn btn-primary" id="joinBtn" type="submit">Join game</button>
      </form>
      <div id="screen" hidden></div>
    </main>

    <footer class="s-footer" id="footer">
      <span id="footJoin">Teacher? <a href="host.html">Host a game</a></span>
      <button class="linkish" id="leaveBtn" hidden type="button">Leave game</button>
    </footer>
  </div>

  <script src="js/core.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
