<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#15123a">
  <title>Classroom Game: join the quiz</title>
  <meta name="description" content="Join your class quiz on your phone: type the room code on the big screen and pick a nickname. Free, no app, no account.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://0.peerjs.com">
  <!-- Share preview (Facebook, Messenger, Viber, X, LinkedIn…) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Classroom Game">
  <meta property="og:title" content="Classroom Game: join the quiz">
  <meta property="og:description" content="Join your class quiz on your phone: type the room code on the big screen and pick a nickname. Free, no app, no account.">
  <meta property="og:url" content="https://missniceph.github.io/classroom-game/">
  <meta property="og:image" content="https://missniceph.github.io/classroom-game/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Classroom Game: four colourful answer buttons and the words “A free live quiz for class”.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preload" href="fonts/lexend-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="student">
    <div class="s-net" id="net" role="status" hidden></div>
    <header class="s-head" id="head" hidden>
      <span class="who" id="who"></span>
      <span class="pts" id="pts">0 pts</span>
    </header>

    <main class="s-main" id="main">
      <h1 class="sr-only">Classroom Game</h1>
      <div class="sr-only" id="announce" aria-live="polite" aria-atomic="true"></div>
      <form class="join-form" id="joinForm" autocomplete="off">
        <div class="brand logo" aria-hidden="true"><span class="brand-mark">?</span> Classroom Game</div>
        <label for="code" class="muted center">Room code (shown on the big screen)</label>
        <input id="code" class="code" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="5" placeholder="ABCDE" required>
        <label for="nick" class="muted center">Your nickname</label>
        <input id="nick" maxlength="20" autocomplete="nickname" spellcheck="false" placeholder="e.g. Juan D." required enterkeyhint="go">
        <div class="form-error" id="formError" role="alert" hidden></div>
        <button class="btn btn-primary" id="joinBtn" type="submit">Join game</button>
      </form>
      <div id="screen" hidden></div>
    </main>

    <footer class="s-footer" id="footer">
      <span id="footJoin">Teacher? <a href="host.html">Host a game</a> · Made by <a href="https://instagram.com/missniceph" target="_blank" rel="noopener">@missniceph</a></span>
      <button class="linkish" id="leaveBtn" hidden type="button">Leave game</button>
    </footer>
  </div>

  <script src="js/core.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
